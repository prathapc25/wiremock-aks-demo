name: Deploy WireMock Stubs

on:
  push:
    branches: [ main ]
    paths: ['stubs/**']

permissions:
  id-token: write      # Required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Upload Stubs to Azure Files
      uses: azure/CLI@v2
      with:
        inlineScript: |
          ACCOUNT_NAME="${{ vars.STORAGE_ACCOUNT }}"
          SHARE_NAME="${{ vars.FILE_SHARE }}"
          ACCOUNT_KEY="${{ secrets.STORAGE_KEY }}"

          # Create directories
          az storage directory create --account-name $ACCOUNT_NAME --account-key $ACCOUNT_KEY --share-name $SHARE_NAME --name mappings || true
          az storage directory create --account-name $ACCOUNT_NAME --account-key $ACCOUNT_KEY --share-name $SHARE_NAME --name __files || true

          # Upload entire folders
          az storage file upload-batch --account-name $ACCOUNT_NAME --account-key $ACCOUNT_KEY --destination $SHARE_NAME/mappings --source ./stubs/mappings
          az storage file upload-batch --account-name $ACCOUNT_NAME --account-key $ACCOUNT_KEY --destination $SHARE_NAME/__files --source ./stubs/__files
          az storage file upload-batch --account-name $ACCOUNT_NAME --account-key $ACCOUNT_KEY --destination $SHARE_NAME/mappings --source ./stubs/mappings
          az storage file upload-batch --account-name $ACCOUNT_NAME --account-key $ACCOUNT_KEY --destination $SHARE_NAME/__files --source ./stubs/__files

          echo "✅ Successfully uploaded WireMock stubs!"

    - name: Reload WireMock mappings via Admin API 
      run: |
          WIREMOCK_URL="https://${{ vars.WIREMOCK_FQDN }}"
          
          echo "Resetting mappings..."
          curl -X POST "${WIREMOCK_URL}/__admin/mappings/reset" \
            -H "Content-Type: application/json" \
            --fail --silent --show-error
          
          echo "Mappings reloaded successfully!"
