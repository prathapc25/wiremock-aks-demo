name: Deploy WireMock Stubs

on:
  push:
    branches: [ main ]
    paths: ['stubs/**']

permissions:
  id-token: write      # Required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Upload Stubs to Azure Files
      uses: azure/CLI@v2
      with:
        inlineScript: |
          echo "=== Starting WireMock Stubs Upload ==="

          ACCOUNT_NAME="${{ vars.STORAGE_ACCOUNT }}"
          SHARE_NAME="${{ vars.FILE_SHARE }}"

          if [ -z "$ACCOUNT_NAME" ]; then
            echo "❌ ERROR: STORAGE_ACCOUNT variable is empty!"
            exit 1
          fi

          echo "📦 Using Storage Account : $ACCOUNT_NAME"
          echo "📂 Using File Share      : $SHARE_NAME"

          # Create directories if they don't exist
          echo "Creating directories..."
          az storage directory create \
            --account-name $ACCOUNT_NAME \
            --share-name $SHARE_NAME \
            --name mappings \
            --auth-mode login || true

          az storage directory create \
            --account-name $ACCOUNT_NAME \
            --share-name $SHARE_NAME \
            --name __files \
            --auth-mode login || true

          # Upload mappings folder
          echo "Uploading mappings..."
          az storage file upload-batch \
            --account-name $ACCOUNT_NAME \
            --destination $SHARE_NAME/mappings \
            --source ./stubs/mappings \
            --auth-mode login

          # Upload __files folder
          echo "Uploading __files..."
          az storage file upload-batch \
            --account-name $ACCOUNT_NAME \
            --destination $SHARE_NAME/__files \
            --source ./stubs/__files \
            --auth-mode login

          echo "✅ Successfully uploaded WireMock stubs!"
    
